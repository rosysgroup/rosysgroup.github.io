<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunities – RoSys Group</title>
    <link rel="icon" type="image/png" href="gallery/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #002147; --accent: #0056b3; --max-width: 1100px; --success: #28a745;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: #333; line-height: 1.6; background: #f4f7f9; }

        /* Navigation */
        nav { background: var(--primary); padding: 18px 0; position: sticky; top: 0; z-index: 2000; text-align: center; }
        nav a { margin: 0 18px; text-decoration: none; font-weight: bold; color: white; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }

        /* Header */
        header { 
            background: white; padding: 5px 0; border-bottom: 1px solid #eee; 
            display: flex; justify-content: center; height: 120px; align-items: center;
        }
        .header-content { 
            width: 100%; max-width: var(--max-width); padding: 0 20px; 
            display: flex; align-items: center; justify-content: space-between; gap: 30px; 
        }
        .header-text-section h1 { margin: 0; font-size: 2.2rem; color: var(--primary); line-height: 1.1; }
        .header-text-section p { margin: 5px 0 0 0; color: #666; }
        .header-logo-section img { max-height: 110px; width: auto; display: block; }

        .container { max-width: var(--max-width); margin: 40px auto; padding: 0 20px; }

        /* Thesis Grid */
        .opp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-bottom: 60px; }
        .opp-card { 
            background: white; border-radius: 12px; padding: 25px; border-top: 5px solid var(--accent);
            box-shadow: 0 6px 18px rgba(0,0,0,0.06); display: flex; flex-direction: column;
        }
        .status-badge { align-self: flex-start; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; background: #e8f5e9; color: var(--success); margin-bottom: 15px; }
        
        /* Markdown Table Styling */
        .markdown-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto; }
        .markdown-container table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .markdown-container th { text-align: left; background: #f8f9fa; padding: 12px; border-bottom: 2px solid #dee2e6; color: var(--primary); }
        .markdown-container td { padding: 12px; border-bottom: 1px solid #eee; }

        .btn-apply { display: block; text-align: center; background: var(--primary); color: white; text-decoration: none; padding: 10px; border-radius: 6px; margin-top: auto; font-weight: bold; }

        /* Footer */
        footer { background: var(--primary); color: white; padding: 30px 20px; text-align: center; margin-top: 80px; }
        .footer-line { display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap; font-size: 0.95rem; }
        .footer-socials { display: flex; gap: 20px; }
        .footer-socials a { color: white; font-size: 1.4rem; transition: 0.3s; }
        .footer-socials a:hover { color: var(--accent); transform: translateY(-3px); }
    </style>
</head>
<body>
<nav>
    <a href="index.html">Home</a> <span>|</span>
    <a href="team.html">Team</a> <span>|</span>
    <a href="robots.html">Robots</a> <span>|</span>
    <a href="lab.html">Lab</a> <span>|</span>
    <a href="publications.html">Publications</a> <span>|</span>
    <a href="research.html">Research</a> <span>|</span>
    <a href="opportunity.html">Opportunity</a>
</nav>

<header>
    <div class="header-content">
        <div class="header-text-section">
            <h1>Opportunities</h1>
            <p>Thesis & Research Positions</p>
        </div>
        <div class="header-logo-section">
            <img src="gallery/LOGO_Rosys_University.png" alt="RoSys Logo">
        </div>
    </div>
</header>

<div class="container">
    <h2 style="color: var(--primary);">Open Positions</h2>
    <div class="opp-grid" id="opp-container"></div>

    <h2 style="color: var(--primary); margin-top: 60px;">Completed Thesis Projects</h2>
    <div id="students-container" class="markdown-container"></div>
</div>

<footer>
    <div class="footer-line">
        <span>&copy; 2026 RoSys Group - All Rights Reserved</span>
        <div class="footer-socials">
            <a href="https://www.linkedin.com/company/rosysgroup/" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://www.youtube.com/@rosys_group" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="mailto:giuseppe.sutera@unict.it"><i class="fas fa-envelope"></i></a>
        </div>
    </div>
</footer>

<script>
    async function loadData() {
        try {
            // Load JSON positions
            const resOpp = await fetch('contents/opportunities.json');
            const opps = await resOpp.json();
            const oppDiv = document.getElementById('opp-container');
            opps.forEach(o => {
                oppDiv.innerHTML += `<div class="opp-card">
                    <span class="status-badge">Available</span>
                    <h3>${o.title}</h3>
                    <p style="font-size:0.9rem; color:#666;"><strong>Degree:</strong> ${o.degree}</p>
                    <p>${o.description}</p>
                    <a href="mailto:giuseppe.sutera@unict.it?subject=Thesis Inquiry: ${o.title}" class="btn-apply">Inquire Now</a>
                </div>`;
            });

            // Load MD students
            const resMD = await fetch('contents/students.md');
            const mdText = await resMD.text();
            document.getElementById('students-container').innerHTML = marked.parse(mdText);
        } catch(e) { console.error(e); }
    }
    loadData();
</script>
</body>
</html>
