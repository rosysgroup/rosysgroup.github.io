<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/png" href="gallery/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #002147; --accent: #0056b3; --max-width: 1100px;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: #333; line-height: 1.6; background: #fff; }

        nav { background: var(--primary); padding: 18px 0; position: sticky; top: 0; z-index: 2000; text-align: center; }
        nav a { margin: 0 18px; text-decoration: none; font-weight: bold; color: white; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }

        header { 
            background: white; padding: 20px 0; border-bottom: 1px solid #eee; 
            display: flex; justify-content: center; height: 120px; align-items: center; 
        }
        .header-content { 
            width: 100%; max-width: var(--max-width); padding: 0 20px; 
            display: flex; align-items: center; justify-content: space-between; 
        }
        .header-text-section h1 { margin: 0; font-size: 2.2rem; color: var(--primary); }
        .header-logo-section img { max-height: 100px; }

        .container { max-width: var(--max-width); margin: 40px auto; padding: 0 20px; min-height: 600px; }

        /* Customizing BibBase Appearance */
        #bibbase_header { margin-bottom: 30px; }
        .bibbase_group_title { color: var(--primary) !important; font-size: 1.8rem !important; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 40px !important; }
        .bibbase_paper_title { color: var(--accent) !important; font-weight: bold !important; font-size: 1.1rem !important; }
        .bibbase_paper_author { font-size: 0.95rem !important; }
        
        /* Search bar and filters styling */
        #bibbase_controls { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eee; }

        footer { background: var(--primary); color: white; padding: 30px 20px; text-align: center; margin-top: 80px; }
    </style>
</head>
