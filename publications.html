        :root { --primary: #002147; --accent: #0056b3; --max-width: 1100px; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: #333; line-height: 1.4; background: #fff; }

        header { background: white; padding: 20px 0; border-bottom: 1px solid #eee; display: flex; justify-content: center; height: 120px; align-items: center; }
        .header-content { width: 100%; max-width: var(--max-width); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .header-text-section h1 { margin: 0; font-size: 2.2rem; color: var(--primary); }
        .header-logo-section img { max-height: 100px; }

        .container { max-width: var(--max-width); margin: 30px auto; padding: 0 20px; min-height: 600px; }

        /* COMPACT & CLEAN OVERRIDES */
        .bibbase_paper { margin-bottom: 12px !important; line-height: 1.3 !important; font-size: 0.95rem !important; }
        .bibbase_paper_title { color: var(--accent) !important; font-weight: 600 !important; font-size: 1rem !important; }
        
        /* Nasconde la riga dei link (bibtex, abstract, ecc.) */
        .bibbase_paper_links { display: none !important; }

        .bibbase_group_title { 
            color: var(--primary) !important; 
            font-size: 1.3rem !important; 
            border-bottom: 1px solid #ddd; 
            margin-top: 25px !important; 
            margin-bottom: 10px !important; 
            padding-bottom: 5px;
            text-transform: capitalize;
        }

        footer { background: var(--primary); color: white; padding: 30px 20px; text-align: center; margin-top: 80px; }
        .footer-line { display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap; font-size: 0.95rem; opacity: 0.9; }
        .footer-socials { display: flex; gap: 20px; align-items: center; }
        .footer-socials a { color: white; font-size: 1.4rem; text-decoration: none; transition: all 0.3s; }
        .footer-socials a:hover { color: var(--accent); transform: translateY(-3px); }
    </style>

<div class="container" id="publications-container">
    <script src="https://bibbase.org/show?bib=https%3A%2F%2Frosysgroup.github.io%2Fcontents%2Fpublications.bib&jsonp=1&group0=year&group1=type&theme=simple&hide=links"></script>
</div>

<script>
    // Funzione per rinominare le categorie (Article -> Journal, Inproceedings -> Conference)
    function renameCategories() {
        const headers = document.querySelectorAll('.bibbase_group_title');
        headers.forEach(h => {
            let text = h.textContent.trim().toLowerCase();
            if (text === 'article') {
                h.textContent = 'Journals';
            } else if (text === 'inproceedings') {
                h.textContent = 'Conferences';
            }
        });
    }

    // Eseguiamo il controllo ogni secondo per i primi 5 secondi finché BibBase non ha finito di caricare
    let attempts = 0;
    const interval = setInterval(() => {
        renameCategories();
        attempts++;
        if (attempts > 5) clearInterval(interval);
    }, 1000);
</script>
