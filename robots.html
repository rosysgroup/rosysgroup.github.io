<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robots – RoSys Group</title>
    <link rel="icon" type="image/png" href="gallery/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #002147; --accent: #0056b3; --yt-red: #e62117; --bg: #ffffff; --text: #333; --max-width: 1100px;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--text); background: white; line-height: 1.6; }

        /* Navigation */
        nav { background: var(--primary); padding: 18px 0; position: sticky; top: 0; z-index: 2000; text-align: center; }
        nav a { margin: 0 18px; text-decoration: none; font-weight: bold; color: white; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }

        /* Header COMPATTO (Stile Lab) */
        header { 
            background: white; 
            padding: 5px 0; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            justify-content: center; 
            height: 120px; 
            align-items: center;
        }
        .header-content {
            width: 100%; max-width: var(--max-width); padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between; gap: 30px;
        }
        .header-text-section h1 { margin: 0; font-size: 2.2rem; color: var(--primary); line-height: 1.1; }
        .header-text-section p { margin: 5px 0 0 0; color: #666; font-size: 1rem; }
        
        /* Logo Ingrandito */
        .header-logo-section img { max-height: 110px; width: auto; display: block; }

        /* Robots Container */
        .container { max-width: var(--max-width); margin: 40px auto; padding: 0 20px; }
        
        .category-title {
            font-size: 1.8rem; color: var(--primary); border-bottom: 2px solid #eee;
            margin: 50px 0 30px 0; padding-bottom: 10px;
        }

        .robots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 40px;
        }

        .robot-card {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .robot-card:hover { transform: translateY(-3px); }

        .robot-photo {
            flex: 0 0 160px; 
            aspect-ratio: 4 / 3; 
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .robot-photo img { width: 100%; height: 100%; object-fit: cover; }
        
        .robot-info { flex: 1; }
        .robot-name { font-weight: bold; font-size: 1.3rem; color: #000; margin: 0; }
        .robot-type { font-size: 0.8rem; color: var(--accent); font-weight: 600; text-transform: uppercase; }
        .robot-desc { font-size: 0.9rem; color: #555; margin-top: 8px; text-align: justify; }

        .robot-video-link { margin-top: 10px; }
        .robot-video-link a {
            text-decoration: none; color: var(--yt-red); font-weight: bold; font-size: 0.8rem;
            display: inline-flex; align-items: center; gap: 5px;
        }

        /* Footer con Social */
        footer { 
            background: var(--primary); color: white; padding: 40px 20px; 
            text-align: center; margin-top: 80px; 
        }
        .social-links { margin-bottom: 20px; }
        .social-links a { 
            color: white; font-size: 1.5rem; margin: 0 15px; 
            text-decoration: none; opacity: 0.8; transition: opacity 0.3s;
        }
        .social-links a:hover { opacity: 1; color: var(--accent); }
        .footer-credits { font-size: 0.9rem; opacity: 0.7; }

        @media (max-width: 900px) {
            header { height: auto; padding: 20px 0; }
            .header-content { flex-direction: column-reverse; text-align: center; }
            .robots-grid { grid-template-columns: 1fr; }
            .robot-card { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a> <span>|</span>
    <a href="team.html">Team</a> <span>|</span>
    <a href="robots.html">Robots</a> <span>|</span>
    <a href="lab.html">Lab</a> <span>|</span>
    <a href="publications.html">Publications</a> <span>|</span>
    <a href="research.html">Research</a> <span>|</span>
    <a href="opportunity.html">Opportunity</a>
</nav>

<header>
    <div class="header-content">
        <div class="header-text-section">
            <h1>Our Robots</h1>
            <p>Fleet and Experimental Platforms</p>
        </div>
        <div class="header-logo-section">
            <img src="gallery/LOGO_Rosys_University.png" alt="RoSys Logo">
        </div>
    </div>
</header>

<div class="container" id="robots-container">
    </div>

<footer>
    <div class="social-links">
        <a href="https://www.linkedin.com/company/tuo-profilo" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="https://www.youtube.com/tuo-canale" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="https://github.com/tuo-github" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="mailto:tuamail@esempio.com" title="Email"><i class="fas fa-envelope"></i></a>
    </div>
    <div class="footer-credits">
        &copy; 2026 RoSys Group - All Rights Reserved
    </div>
</footer>

<script>
    async function loadRobots() {
        try {
            const response = await fetch('contents/robots.json');
            const robots = await response.json();
            const container = document.getElementById('robots-container');

            const categories = [...new Set(robots.map(r => r.category))];

            categories.forEach(cat => {
                const section = document.createElement('div');
                section.innerHTML = `<h2 class="category-title">${cat}</h2>`;
                
                const grid = document.createElement('div');
                grid.className = 'robots-grid';
                
                robots.filter(r => r.category === cat).forEach(r => {
                    grid.innerHTML += `
                        <div class="robot-card">
                            <div class="robot-photo">
                                <img src="${r.photo}" alt="${r.name}" onerror="this.src='gallery/robots/placeholder.jpg'">
                            </div>
                            <div class="robot-info">
                                <div class="robot-name">${r.name}</div>
                                <div class="robot-type">${r.type}</div>
                                <div class="robot-desc">${r.description}</div>
                                ${r.video && r.video !== "#" && r.video !== "" ? `
                                    <div class="robot-video-link">
                                        <a href="${r.video}" target="_blank">
                                            <i class="fab fa-youtube"></i> WATCH VIDEO
                                        </a>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
                section.appendChild(grid);
                container.appendChild(section);
            });
        } catch (e) { 
            console.error("Error loading robots.json", e); 
        }
    }
    loadRobots();
</script>
</body>
</html>
