<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoSys Group – Robotic Systems</title>
    <link rel="icon" type="image/png" href="gallery/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #002147;
            --accent: #0056b3;
            --bg: #ffffff;
            --text: #333;
            --max-width: 1100px;
        }

        html { scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; color: var(--text); line-height: 1.6; background-color: var(--bg); }

        nav {
            background: var(--primary);
            padding: 18px 0;
            position: sticky;
            top: 0;
            z-index: 2000;
            text-align: center;
        }
        nav a { 
            margin: 0 20px; 
            text-decoration: none; 
            font-weight: bold; 
            color: white; 
            text-transform: uppercase; 
            font-size: 0.85rem; 
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        nav a:hover { color: #bdc3c7; }

        header { 
            background: white;
            padding: 60px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: center;
            min-height: 200px;
        }

        .header-content {
            width: 100%;
            max-width: var(--max-width);
            padding: 0 20px;
            display: flex;
            align-items: center; 
            justify-content: space-between;
            gap: 50px;
        }

        .header-text-section { flex: 2; text-align: left; }
        .header-text-section h1 { 
            margin: 0 0 15px 0; 
            font-size: 3rem; 
            color: var(--primary); 
            line-height: 1.1;
        }
        
        #header-about-content {
            font-size: 1.1rem;
            color: #444;
            max-width: 750px;
            text-align: justify;
        }

        .header-logo-section img {
            max-height: 160px; 
            width: auto;
            display: block;
        }

        .gallery-container {
            position: relative;
            max-width: var(--max-width);
            margin: 40px auto;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: #f0f0f0;
        }
        .slides { display: flex; transition: transform 0.6s cubic-bezier(0.45, 0, 0.55, 1); }
        .slide { 
            min-width: 100%; 
            height: 450px; 
            object-fit: cover; 
        }

        .prev, .next {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.4); backdrop-filter: blur(5px);
            color: var(--primary); padding: 15px; cursor: pointer; border: none; 
            font-size: 20px; z-index: 10; border-radius: 50%;
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
        }
        .next { right: 15px; } .prev { left: 15px; }

        section { max-width: var(--max-width); margin: 60px auto; padding: 0 20px; }
        h2 { font-size: 2.2rem; border-left: 6px solid var(--primary); padding-left: 20px; color: var(--primary); margin-bottom: 30px; }

        footer { 
            background: var(--primary); 
            color: white; 
            padding: 30px 20px; 
            text-align: center; 
            margin-top: 80px; 
        }
        .footer-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            font-size: 0.95rem;
            opacity: 0.9;
        }
        .footer-socials {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .footer-socials a { 
            color: white; 
            font-size: 1.4rem; 
            text-decoration: none; 
            transition: all 0.3s;
            display: inline-block;
        }
        .footer-socials a:hover { 
            color: var(--accent); 
            transform: translateY(-3px);
        }

        @media (max-width: 900px) {
            header { padding: 40px 0; }
            .header-content { flex-direction: column-reverse; text-align: center; }
            .header-logo-section { margin-bottom: 30px; }
            .header-text-section h1 { font-size: 2.2rem; }
            .slide { height: 320px; }
            .footer-line { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a> <span>|</span>
    <a href="team.html">Team</a> <span>|</span>
    <a href="robots.html">Robots</a> <span>|</span>
    <a href="lab.html">Lab</a> <span>|</span>
    <a href="publications.html">Publications</a> <span>|</span>
    <a href="research.html">Research</a> <span>|</span>
    <a href="opportunity.html">Opportunity</a>
</nav>

<header>
    <div class="header-content">
        <div class="header-text-section">
            <h1>RoSys Group</h1>
            <div id="header-about-content"></div>
        </div>
        <div class="header-logo-section">
            <img src="gallery/LOGO_Rosys_University.png" alt="RoSys Logo">
        </div>
    </div>
</header>

<div class="gallery-container">
    <div class="slides" id="gallery-slides"></div>
    <button class="prev" onclick="manualMove(-1)">&#10094;</button>
    <button class="next" onclick="manualMove(1)">&#10095;</button>
</div>

<section id="news">
    <h2>Latest News</h2>
    <div id="news-content"></div>
</section>

<footer>
    <div class="footer-line">
        <span>&copy; 2026 RoSys Group - All Rights Reserved</span>
        <div class="footer-socials">
            <a href="https://www.linkedin.com/company/rosysgroup/" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://www.youtube.com/@rosys_group" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://www.instagram.com/rosys_group/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="mailto:giuseppe.sutera@unict.it"><i class="fas fa-envelope"></i></a>
        </div>
    </div>
</footer>

<script>
    const totalImages = 15;
    const slidesContainer = document.getElementById('gallery-slides');
    let currentSlide = 0;

    function initGallery() {
        for (let i = 1; i <= totalImages; i++) {
            const img = document.createElement('img');
            img.src = `gallery/images/image${i}.jpg`; 
            img.className = 'slide';
            
            // If image fails to load, it is removed from the DOM
            img.onerror = function() { 
                this.remove();
                // Adjust position after removal
                updateSlidePosition();
            };
            
            slidesContainer.appendChild(img);
        }
    }

    function updateSlidePosition() {
        const slides = document.querySelectorAll('.slide');
        if (slides.length === 0) return;
        
        // Ensure currentSlide is within bounds
        currentSlide = (currentSlide + slides.length) % slides.length;
        slidesContainer.style.transform = `translateX(${-currentSlide * 100}%)`;
    }

    function moveSlide(n) {
        const slides = document.querySelectorAll('.slide');
        if (slides.length === 0) return;
        currentSlide = (currentSlide + n + slides.length) % slides.length;
        updateSlidePosition();
    }

    // Auto-advance
    let autoSlide = setInterval(() => moveSlide(1), 6000);

    // Manual navigation (resets timer)
    function manualMove(n) {
        clearInterval(autoSlide);
        moveSlide(n);
        autoSlide = setInterval(() => moveSlide(1), 6000);
    }

    async function loadMD(id, file) {
        try {
            const r = await fetch(`contents/${file}`);
            if (r.ok) {
                const text = await r.text();
                const container = document.getElementById(id);
                container.innerHTML = marked.parse(text);
            }
        } catch (e) { console.error("Error loading:", file, e); }
    }

    initGallery();
    loadMD("header-about-content", "about.md");
    loadMD("news-content", "news.md");
</script>

</body>
</html>
