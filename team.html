<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team – RoSys Group</title>
    <link rel="icon" type="image/png" href="gallery/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #002147; --accent: #0056b3; --max-width: 1100px;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: #333; line-height: 1.6; background: white; }

        nav { background: var(--primary); padding: 18px 0; position: sticky; top: 0; z-index: 2000; text-align: center; }
        nav a { margin: 0 18px; text-decoration: none; font-weight: bold; color: white; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }

        header { background: white; padding: 5px 0; border-bottom: 1px solid #eee; display: flex; justify-content: center; height: 120px; align-items: center; }
        .header-content { width: 100%; max-width: var(--max-width); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        .header-logo-section img { max-height: 110px; }

        .container { max-width: var(--max-width); margin: 40px auto; padding: 0 20px; }

        /* Members Section */
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; margin-bottom: 80px; }
        .member-card { text-align: center; background: #fff; padding: 20px; border-radius: 12px; transition: 0.3s; }
        .member-card:hover { transform: translateY(-5px); }
        .member-card img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 4px solid #f0f0f0; }
        .member-card h3 { margin: 10px 0 5px 0; color: var(--primary); }
        .member-card p { margin: 0; color: #666; font-size: 0.9rem; }

        /* Students MD Styling */
        .markdown-container table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .markdown-container th { text-align: left; background: #f8f9fa; padding: 12px; border-bottom: 2px solid #dee2e6; }
        .markdown-container td { padding: 12px; border-bottom: 1px solid #eee; }

        footer { background: var(--primary); color: white; padding: 30px 20px; text-align: center; margin-top: 80px; }
        .footer-line { display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap; }
        .footer-socials a { color: white; font-size: 1.4rem; margin: 0 10px; }
    </style>
</head>
<body>
<nav>
    <a href="index.html">Home</a> <span>|</span>
    <a href="team.html">Team</a> <span>|</span>
    <a href="robots.html">Robots</a> <span>|</span>
    <a href="lab.html">Lab</a> <span>|</span>
    <a href="publications.html">Publications</a> <span>|</span>
    <a href="research.html">Research</a> <span>|</span>
    <a href="opportunity.html">Opportunity</a>
</nav>

<header>
    <div class="header-content">
        <div class="header-text-section"><h1>Our Team</h1><p>Researchers and Students</p></div>
        <div class="header-logo-section"><img src="gallery/LOGO_Rosys_University.png" alt="RoSys Logo"></div>
    </div>
</header>

<div class="container">
    <h2 style="color: var(--primary);">Faculty & Staff</h2>
    <div class="team-grid" id="team-container"></div>

    <h2 style="color: var(--primary); margin-top: 60px;">Student Researchers & Alumni</h2>
    <div id="students-container" class="markdown-container"></div>
</div>

<footer>
    <div class="footer-line">
        <span>&copy; 2026 RoSys Group - All Rights Reserved</span>
        <div class="footer-socials">
            <a href="https://www.linkedin.com/company/rosysgroup/" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="mailto:giuseppe.sutera@unict.it"><i class="fas fa-envelope"></i></a>
        </div>
    </div>
</footer>

<script>
    async function loadTeam() {
        try {
            // Members
            const resTeam = await fetch('contents/team.json');
            const members = await resTeam.json();
            const teamDiv = document.getElementById('team-container');
            members.forEach(m => {
                teamDiv.innerHTML += `<div class="member-card">
                    <img src="${m.photo}" alt="${m.name}" onerror="this.src='gallery/placeholder.jpg'">
                    <h3>${m.name}</h3>
                    <p>${m.role}</p>
                </div>`;
            });

            // Students from MD
            const resMD = await fetch('contents/students.md');
            const mdText = await resMD.text();
            document.getElementById('students-container').innerHTML = marked.parse(mdText);
        } catch(e) { console.error(e); }
    }
    loadTeam();
</script>
</body>
</html>
