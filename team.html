<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team – RoSys Group</title>
    <link rel="icon" type="image/png" href="gallery/favicon.png">
    <style>
        :root {
            --primary: #002147; --accent: #0056b3; --bg: #ffffff; --text: #333; --max-width: 1100px;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--text); background: white; line-height: 1.6; }

        /* Navigation */
        nav { background: var(--primary); padding: 18px 0; position: sticky; top: 0; z-index: 2000; text-align: center; color: rgba(255,255,255,0.3); }
        nav a { margin: 0 18px; text-decoration: none; font-weight: bold; color: white; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }

        /* Header (Coerente con Index) */
        header { 
            background: white;
            padding: 60px 0; 
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: center;
        }
        .header-content {
            width: 100%;
            max-width: var(--max-width);
            padding: 0 20px;
            display: flex;
            align-items: center; 
            justify-content: space-between;
            gap: 50px;
        }
        .header-text-section h1 { margin: 0; font-size: 3rem; color: var(--primary); line-height: 1.1; }
        .header-logo-section img { max-height: 160px; width: auto; display: block; }

        /* Team Container */
        .container { max-width: var(--max-width); margin: 40px auto; padding: 0 20px; }
        
        .category-title {
            font-size: 1.8rem;
            color: var(--primary);
            border-bottom: 2px solid #eee;
            margin: 50px 0 30px 0;
            padding-bottom: 10px;
        }

        /* Griglia principale a due colonne */
        .team-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Due colonne fisse come richiesto */
            gap: 50px 80px;
        }

        /* Struttura Membro */
        .member-card {
            display: flex;
            flex-direction: column;
        }

        /* Riga superiore: Foto e Nome */
        .member-top-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        .photo-wrapper {
            flex: 0 0 80px; /* Foto leggermente più piccola per stare accanto al nome */
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 6px;
            background: #f9f9f9;
        }
        .photo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .member-name-box { flex: 1; }
        .member-name { font-weight: bold; font-size: 1.15rem; color: #000; margin: 0; line-height: 1.2; }
        .member-role { font-size: 0.9rem; color: #666; }
        
        /* Riga inferiore: Links (sotto tutto) */
        .member-links { 
            display: flex; 
            gap: 15px; 
            padding-top: 5px;
            border-top: 1px solid #f0f0f0;
        }
        .member-links a {
            text-decoration: none;
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }
        .member-links a:hover { opacity: 0.6; }

        footer { background: var(--primary); color: white; padding: 40px; text-align: center; margin-top: 80px; }

        /* Responsive per tablet/mobile */
        @media (max-width: 850px) {
            .team-grid { grid-template-columns: 1fr; gap: 40px; }
            .header-content { flex-direction: column-reverse; text-align: center; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a> <span>|</span>
    <a href="team.html">Team</a> <span>|</span>
    <a href="robots.html">Robots</a> <span>|</span>
    <a href="lab.html">Lab</a> <span>|</span>
    <a href="publications.html">Publications</a> <span>|</span>
    <a href="research.html">Research</a> <span>|</span>
    <a href="opportunity.html">Opportunity</a>
</nav>

<header>
    <div class="header-content">
        <div class="header-text-section">
            <h1>Our Team</h1>
            <p style="color: #666;">Research Staff and Students</p>
        </div>
        <div class="header-logo-section">
            <img src="gallery/LOGO_Rosys_University.png" alt="RoSys Logo">
        </div>
    </div>
</header>

<div class="container" id="team-sections-container">
    </div>

<footer><p>&copy; 2026 RoSys Group - University of Catania</p></footer>

<script>
    const categories = [
        "Head of the lab",
        "Associate & Assistant professors",
        "Research fellows",
        "PhD Students",
        "Alumni"
    ];

    async function loadTeam() {
        try {
            const response = await fetch('contents/team.json');
            const members = await response.json();
            const container = document.getElementById('team-sections-container');

            categories.forEach(cat => {
                const catMembers = members.filter(m => m.category === cat);
                if (catMembers.length > 0) {
                    const section = document.createElement('div');
                    section.innerHTML = `<h2 class="category-title">${cat}</h2>`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'team-grid';
                    
                    catMembers.forEach(m => {
                        grid.innerHTML += `
                            <div class="member-card">
                                <div class="member-top-row">
                                    <div class="photo-wrapper">
                                        <img src="${m.photo}" alt="${m.name}" onerror="this.src='gallery/team/placeholder.jpg'">
                                    </div>
                                    <div class="member-name-box">
                                        <div class="member-name">${m.name}</div>
                                        <div class="member-role">${m.role}</div>
                                    </div>
                                </div>
                                <div class="member-links">
                                    ${m.web && m.web !== "#" ? `<a href="${m.web}" target="_blank">Website</a>` : ''}
                                    ${m.scholar && m.scholar !== "#" ? `<a href="${m.scholar}" target="_blank">Scholar</a>` : ''}
                                    ${m.linkedin && m.linkedin !== "#" ? `<a href="${m.linkedin}" target="_blank">LinkedIn</a>` : ''}
                                </div>
                            </div>
                        `;
                    });
                    section.appendChild(grid);
                    container.appendChild(section);
                }
            });
        } catch (e) { console.error(e); }
    }
    loadTeam();
</script>
</body>
</html>
