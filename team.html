<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team – RoSys Group</title>
    <link rel="icon" type="image/png" href="gallery/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #002147; --accent: #0056b3; --bg: #ffffff; --text: #333; --max-width: 1100px;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--text); background: white; line-height: 1.6; }

        /* Navigation */
        nav { background: var(--primary); padding: 18px 0; position: sticky; top: 0; z-index: 2000; text-align: center; }
        nav a { margin: 0 18px; text-decoration: none; font-weight: bold; color: white; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }

        /* Header COMPATTO (Stile Lab/Robots) */
        header { 
            background: white; 
            padding: 5px 0; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            justify-content: center; 
            height: 120px; 
            align-items: center;
        }
        .header-content {
            width: 100%; max-width: var(--max-width); padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between; gap: 30px;
        }
        .header-text-section h1 { margin: 0; font-size: 2.2rem; color: var(--primary); line-height: 1.1; }
        .header-text-section p { margin: 5px 0 0 0; color: #666; font-size: 1rem; }
        
        /* Logo Ingrandito */
        .header-logo-section img { max-height: 110px; width: auto; display: block; }

        /* Team Container */
        .container { max-width: var(--max-width); margin: 40px auto; padding: 0 20px; }
        
        .category-title {
            font-size: 1.8rem; color: var(--primary); border-bottom: 2px solid #eee;
            margin: 60px 0 30px 0; padding-bottom: 10px;
        }

        .team-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 60px 40px;
        }

        .member-card {
            display: flex; align-items: center; gap: 25px;
        }

        .photo-wrapper {
            flex: 0 0 160px; aspect-ratio: 1 / 1; overflow: hidden;
            border-radius: 8px; background: #f9f9f9; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .photo-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .member-info { flex: 1; display: flex; flex-direction: column; }
        .member-name { font-weight: bold; font-size: 1.3rem; color: #000; margin: 0; line-height: 1.2; }
        .member-role { font-size: 1rem; color: #666; margin: 4px 0 10px 0; }
        
        /* Links style */
        .member-links { 
            display: flex; flex-wrap: wrap; gap: 15px; margin-top: 5px;
        }
        .member-links a {
            text-decoration: none; font-size: 0.8rem; color: var(--accent);
            font-weight: bold; text-transform: uppercase; transition: color 0.2s;
        }
        .member-links a:hover { color: var(--primary); text-decoration: underline; }

        /* Footer Moderno con Social */
        footer { 
            background: var(--primary); color: white; padding: 40px 20px; 
            text-align: center; margin-top: 80px; 
        }
        .social-links { margin-bottom: 20px; }
        .social-links a { 
            color: white; font-size: 1.5rem; margin: 0 15px; 
            text-decoration: none; opacity: 0.8; transition: opacity 0.3s;
        }
        .social-links a:hover { opacity: 1; color: var(--accent); }
        .footer-credits { font-size: 0.9rem; opacity: 0.7; }

        @media (max-width: 950px) {
            header { height: auto; padding: 20px 0; }
            .header-content { flex-direction: column-reverse; text-align: center; }
            .team-grid { grid-template-columns: 1fr; }
            .member-card { flex-direction: column; text-align: center; }
            .member-links { justify-content: center; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a> <span>|</span>
    <a href="team.html">Team</a> <span>|</span>
    <a href="robots.html">Robots</a> <span>|</span>
    <a href="lab.html">Lab</a> <span>|</span>
    <a href="publications.html">Publications</a> <span>|</span>
    <a href="research.html">Research</a> <span>|</span>
    <a href="opportunity.html">Opportunity</a>
</nav>

<header>
    <div class="header-content">
        <div class="header-text-section">
            <h1>Our Team</h1>
            <p>Faculty, Researchers and Students</p>
        </div>
        <div class="header-logo-section">
            <img src="gallery/LOGO_Rosys_University.png" alt="RoSys Logo">
        </div>
    </div>
</header>

<div class="container" id="team-sections-container"></div>

<footer>
    <div class="social-links">
        <a href="https://www.linkedin.com/company/tuo-profilo" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="https://www.youtube.com/tuo-canale" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="https://github.com/tuo-github" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="mailto:tuamail@esempio.com" title="Email"><i class="fas fa-envelope"></i></a>
    </div>
    <div class="footer-credits">
        &copy; 2026 RoSys Group - All Rights Reserved
    </div>
</footer>

<script>
    const categories = [
        "Head of the lab",
        "Associate & Assistant professors",
        "Research fellows",
        "Engineers",
        "PhD Students",
        "Alumni"
    ];

    async function loadTeam() {
        try {
            const response = await fetch('contents/team.json');
            const members = await response.json();
            const container = document.getElementById('team-sections-container');

            const excludeFields = ['name', 'role', 'category', 'photo'];

            categories.forEach(cat => {
                const catMembers = members.filter(m => m.category === cat);
                if (catMembers.length > 0) {
                    const section = document.createElement('div');
                    section.innerHTML = `<h2 class="category-title">${cat}</h2>`;
                    const grid = document.createElement('div');
                    grid.className = 'team-grid';
                    
                    catMembers.forEach(m => {
                        let linksHtml = '';
                        Object.entries(m).forEach(([key, value]) => {
                            if (!excludeFields.includes(key) && value && value !== "#" && value !== "") {
                                const label = key.charAt(0).toUpperCase() + key.slice(1);
                                linksHtml += `<a href="${value}" target="_blank">${label}</a>`;
                            }
                        });

                        grid.innerHTML += `
                            <div class="member-card">
                                <div class="photo-wrapper">
                                    <img src="${m.photo}" alt="${m.name}" onerror="this.src='gallery/team/placeholder.jpg'">
                                </div>
                                <div class="member-info">
                                    <div class="member-name">${m.name}</div>
                                    <div class="member-role">${m.role}</div>
                                    <div class="member-links">${linksHtml}</div>
                                </div>
                            </div>
                        `;
                    });
                    section.appendChild(grid);
                    container.appendChild(section);
                }
            });
        } catch (e) { console.error("Errore caricamento team:", e); }
    }
    loadTeam();
</script>
</body>
</html>
