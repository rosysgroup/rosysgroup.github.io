<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab – RoSys Group</title>
    <link rel="icon" type="image/png" href="gallery/favicon.png">
    <style>
        :root {
            --primary: #002147; --accent: #0056b3; --max-width: 1100px;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: #333; line-height: 1.6; }

        /* Navigation */
        nav { background: var(--primary); padding: 18px 0; position: sticky; top: 0; z-index: 2000; text-align: center; }
        nav a { margin: 0 18px; text-decoration: none; font-weight: bold; color: white; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }

        /* Header RIDOTTO */
        header { background: white; padding: 25px 0; border-bottom: 1px solid #eee; display: flex; justify-content: center; }
        .header-content { width: 100%; max-width: var(--max-width); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 30px; }
        .header-text-section h1 { margin: 0; font-size: 2.2rem; color: var(--primary); }
        .header-logo-section img { max-height: 90px; }

        .container { max-width: var(--max-width); margin: 30px auto; padding: 0 20px; }
        
        .lab-intro { font-size: 1.1rem; color: #555; margin-bottom: 30px; }

        /* Gallery */
        .lab-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .gallery-item { border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); background: #f9f9f9; }
        .gallery-item img { width: 100%; height: 220px; object-fit: cover; }
        .gallery-caption { padding: 10px; font-size: 0.85rem; color: #666; text-align: center; }

        /* Sezione Video e Mappa */
        .lab-media-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 50px;
        }
        .media-box h3 { color: var(--primary); margin-bottom: 15px; border-left: 4px solid var(--accent); padding-left: 10px; }
        
        .responsive-iframe {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .responsive-iframe iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        footer { background: var(--primary); color: white; padding: 40px; text-align: center; margin-top: 60px; }

        @media (max-width: 900px) {
            .lab-media-section { grid-template-columns: 1fr; }
            .header-content { flex-direction: column-reverse; text-align: center; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a> <span>|</span>
    <a href="team.html">Team</a> <span>|</span>
    <a href="robots.html">Robots</a> <span>|</span>
    <a href="lab.html">Lab</a> <span>|</span>
    <a href="publications.html">Publications</a> <span>|</span>
    <a href="research.html">Research</a> <span>|</span>
    <a href="opportunity.html">Opportunity</a>
</nav>

<header>
    <div class="header-content">
        <div class="header-text-section">
            <h1>Our Lab</h1>
            <p style="color: #666;">Experimental Facilities & Infrastructure</p>
        </div>
        <div class="header-logo-section">
            <img src="gallery/LOGO_Rosys_University.png" alt="RoSys Logo">
        </div>
    </div>
</header>

<div class="container">
    <div id="lab-intro" class="lab-intro"></div>
    
    <div class="lab-gallery" id="lab-gallery"></div>

    <div class="lab-media-section">
        <div class="media-box">
            <h3>Lab Video Tour</h3>
            <div class="responsive-iframe">
                <iframe id="lab-video" src="" allowfullscreen></iframe>
            </div>
        </div>
        <div class="media-box">
            <h3>Find Us</h3>
            <div class="responsive-iframe">
                <iframe id="lab-map" src="" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>
    </div>
</div>

<footer><p>&copy; 2026 RoSys Group - University of Catania</p></footer>

<script>
    async function loadLabData() {
        try {
            const response = await fetch('contents/lab.json');
            const data = await response.json();

            document.getElementById('lab-intro').innerText = data.description;
            document.getElementById('lab-video').src = data.video_url;
            document.getElementById('lab-map').src = data.location_embed;

            const gallery = document.getElementById('lab-gallery');
            data.gallery.forEach(img => {
                gallery.innerHTML += `
                    <div class="gallery-item">
                        <img src="${img.src}" alt="${img.caption}" onerror="this.src='gallery/lab/placeholder.jpg'">
                        <div class="gallery-caption">${img.caption}</div>
                    </div>`;
            });
        } catch (e) { console.error("Error:", e); }
    }
    loadLabData();
</script>
</body>
</html>
