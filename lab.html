<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab – RoSys Group</title>
    <meta name="description" content="The RoSys Lab facilities at the Department of Electrical, Electronics and Computer Engineering (DIEEI), University of Catania: equipment, testing areas and location.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Lab – RoSys Group">
    <meta property="og:description" content="RoSys Lab facilities, equipment and testing areas at the University of Catania.">
    <meta property="og:image" content="https://rosysgroup.github.io/gallery/LOGO_Rosys_University.png">
    <meta property="og:url" content="https://rosysgroup.github.io/lab.html">
    <link rel="canonical" href="https://rosysgroup.github.io/lab.html">
    <link rel="icon" type="image/png" href="gallery/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #002147; --accent: #0056b3; --max-width: 1100px;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: #333; line-height: 1.6; background: white; }

        /* Navigation */
        nav { background: var(--primary); padding: 18px 0; position: sticky; top: 0; z-index: 2000; text-align: center; }
        nav a { margin: 0 18px; text-decoration: none; font-weight: bold; color: white; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }

        /* Header */
        header { 
            background: white; 
            padding: 5px 0; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            justify-content: center; 
            height: 120px; 
            align-items: center;
        }
        .header-content { 
            width: 100%; 
            max-width: var(--max-width); 
            padding: 0 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 30px; 
        }
        .header-text-section h1 { margin: 0; font-size: 2.2rem; color: var(--primary); line-height: 1.1; }
        .header-text-section p { margin: 5px 0 0 0; color: #666; }

        .header-logo-section img { 
            max-height: 110px; 
            width: auto; 
            display: block; 
        }

        .container { max-width: var(--max-width); margin: 30px auto; padding: 0 20px; }
        .lab-intro { font-size: 1.1rem; color: #555; margin-bottom: 30px; text-align: justify; }

        /* Gallery */
        .lab-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .gallery-item { border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); background: #f9f9f9; }
        .gallery-item img { width: 100%; height: 220px; object-fit: cover; display: block; }
        .gallery-caption { padding: 12px; font-size: 0.85rem; color: #666; text-align: center; border-top: 1px solid #f0f0f0; background: white; font-weight: 600; }

        /* Equipment */
        .equipment-section { background: #f8f9fa; padding: 30px; border-radius: 8px; border-left: 4px solid var(--primary); margin-bottom: 50px; }
        .equipment-section h2 { margin-top: 0; font-size: 1.5rem; color: var(--primary); }
        .equipment-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; list-style: none; padding: 0; }
        .equipment-list li::before { content: "•"; color: var(--accent); font-weight: bold; margin-right: 10px; }

        /* Media Section */
        .lab-media-section { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 50px; }
        .lab-media-section.full-width { grid-template-columns: 1fr; }
        .media-box h3 { color: var(--primary); margin-bottom: 15px; border-left: 4px solid var(--accent); padding-left: 10px; font-size: 1.4rem; }
        .address-text { font-size: 0.95rem; color: #555; margin-bottom: 15px; }

        .responsive-iframe { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: #eee; }
        .responsive-iframe iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* NEW INLINE FOOTER */
        footer { 
            background: var(--primary); 
            color: white; 
            padding: 30px 20px; 
            text-align: center; 
            margin-top: 80px; 
        }
        .footer-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            font-size: 0.95rem;
            opacity: 0.9;
        }
        .footer-socials {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .footer-socials a { 
            color: white; 
            font-size: 1.4rem; 
            text-decoration: none; 
            transition: all 0.3s;
            display: inline-block;
        }
        .footer-socials a:hover { 
            color: var(--accent); 
            transform: translateY(-3px);
        }

        @media (max-width: 900px) {
            header { height: auto; padding: 20px 0; }
            .header-content { flex-direction: column-reverse; text-align: center; }
            .lab-media-section { grid-template-columns: 1fr !important; }
            .equipment-list { grid-template-columns: 1fr; }
            .footer-line { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Home</a> <span>|</span>
    <a href="team.html">Team</a> <span>|</span>
    <a href="robots.html">Robots</a> <span>|</span>
    <a href="lab.html">Lab</a> <span>|</span>
    <a href="publications.html">Publications</a> <span>|</span>
    <a href="research.html">Research</a> <span>|</span>
    <a href="opportunity.html">Opportunity</a>
</nav>

<header>
    <div class="header-content">
        <div class="header-text-section">
            <h1>Our Lab</h1>
            <p>Experimental Facilities & Infrastructure</p>
        </div>
        <div class="header-logo-section">
            <img src="gallery/LOGO_Rosys_University.png" alt="RoSys Logo">
        </div>
    </div>
</header>

<div class="container">
    <div id="lab-intro" class="lab-intro"></div>
    
    <div class="lab-gallery" id="lab-gallery"></div>

    <div class="equipment-section">
        <h2>Technical Equipment</h2>
        <ul class="equipment-list" id="equipment-list"></ul>
    </div>

    <div class="lab-media-section" id="media-section">
        <div class="media-box" id="video-box">
            <h3>Lab Video Tour</h3>
            <div class="address-text">See our research environment in action.</div>
            <div class="responsive-iframe">
                <iframe id="lab-video" src="" allowfullscreen></iframe>
            </div>
        </div>

        <div class="media-box" id="map-box">
            <h3>Find Us</h3>
            <div id="address-container" class="address-text"></div>
            <div class="responsive-iframe">
                <iframe id="lab-map" src="" allowfullscreen loading="lazy"></iframe>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="footer-line">
        <span>&copy; 2026 RoSys Group - All Rights Reserved</span>
        <div class="footer-socials">
            <a href="https://www.linkedin.com/company/rosysgroup/" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin"></i></a>
            <a href="https://www.youtube.com/@rosys_group" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i></a>
            <a href="https://www.instagram.com/rosys_group/" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i></a>
            <a href="mailto:giuseppe.sutera@unict.it"><i class="fas fa-envelope"></i></a>
        </div>
    </div>
</footer>

<script>
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }

    async function loadLabData() {
        try {
            const response = await fetch('contents/lab.json');
            const data = await response.json();

            document.getElementById('lab-intro').innerText = data.description;
            
            const videoBox = document.getElementById('video-box');
            const mediaSection = document.getElementById('media-section');
            if (data.video_url && data.video_url !== "#" && data.video_url !== "") {
                document.getElementById('lab-video').src = data.video_url;
            } else {
                videoBox.style.display = 'none';
                mediaSection.classList.add('full-width');
            }

            document.getElementById('lab-map').src = data.location_embed;
            document.getElementById('address-container').innerHTML =
                `<strong>Location:</strong> ${escapeHtml(data.address)}, ${escapeHtml(data.cap)} ${escapeHtml(data.city)} (${escapeHtml(data.country)})`;

            // Equipment list from JSON
            const eqList = document.getElementById('equipment-list');
            data.equipment.forEach(item => {
                eqList.innerHTML += `<li>${escapeHtml(item)}</li>`;
            });

            // Gallery from JSON
            const galleryContainer = document.getElementById('lab-gallery');
            data.gallery.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.src}" alt="${escapeHtml(item.caption)}" onerror="this.onerror=null;this.src='gallery/placeholder.svg'">
                    <div class="gallery-caption">${escapeHtml(item.caption)}</div>
                `;
                galleryContainer.appendChild(div);
            });

        } catch (e) { console.error("Error loading lab data:", e); }
    }
    loadLabData();
</script>
</body>
</html>
